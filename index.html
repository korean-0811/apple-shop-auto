<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apple Shop Auto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Apple Shop Auto</h1>
      <p>믿을 수 있는 중고 애플 제품, 저렴한 가격에</p>
      <a href="#products" class="btn">지금 시작하기</a>
    </div>
  </header>

  <section id="products" class="product-section">
    <h2>상품 목록</h2>
    <div class="products">
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200?text=iPhone+16+Pro" alt="iPhone 16 Pro">
        <h3>iPhone 16 Pro</h3>
        <p>상태 A급 · 256GB</p>
        <span>₩650,000</span>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200?text=iPhone+16" alt="iPhone 16">
        <h3>iPhone 16</h3>
        <p>상태 A급 · 128GB</p>
        <span>₩500,000</span>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200?text=AirPods+Pro+2" alt="AirPods Pro 2">
        <h3>AirPods Pro 2세대</h3>
        <p>완전 정품 · 풀박스</p>
        <span>₩150,000</span>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Apple Shop Auto. All rights reserved.</p>
  </footer>
</body>
</html>
