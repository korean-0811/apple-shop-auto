<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apple Shop Auto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Apple Shop Auto</h1>
      <p>중고 Apple 제품 자동 판매 상점</p>
      <a href="#products" class="btn">지금 시작하기</a>
    </div>
  </header>

  <section id="products" class="product-section">
    <h2>상품 목록</h2>
    <div class="products">
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="상품 1">
        <h3>iPhone 13 Pro</h3>
        <p>상태 최상급 · 128GB</p>
        <span>₩850,000</span>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="상품 2">
        <h3>MacBook Air M1</h3>
        <p>8GB RAM · 256GB SSD</p>
        <span>₩990,000</span>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="상품 3">
        <h3>iPad Pro 11"</h3>
        <p>Wi-Fi · 256GB</p>
        <span>₩750,000</span>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Apple Shop Auto. All rights reserved.</p>
  </footer>
</body>
</html>
